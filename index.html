<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Ultimate Custom Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #050508; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 800px; height: 480px; background: #000; border: 4px solid #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        canvas { width: 100%; height: 100%; display: block; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(10, 15, 30, 0.96); z-index: 10; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        h1 { font-size: 2.2rem; margin-bottom: 12px; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
        .roster-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px; }
        .char-card { background: #1e293b; border: 2px solid transparent; border-radius: 8px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: all 0.2s; }
        .char-card:hover { background: #2d3748; }
        .char-card.selected { border-color: #38bdf8; background: #0369a1; }
        .char-color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; margin-bottom: 4px; }
        .char-name { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .diff-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-diff { background: #334155; border: 1px solid #475569; padding: 6px 14px; font-size: 0.75rem; border-radius: 6px; color: #cbd5e1; cursor: pointer; font-weight: bold; }
        .btn-diff.selected { border-color: #38bdf8; color: #fff; background: #2563eb; }
        .btn-start { background: #2563eb; color: #fff; border: none; padding: 10px 35px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        #hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .hud-top { display: flex; justify-content: space-between; width: 100%; }
        .hud-stats { background: rgba(0,0,0,0.65); padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.1); }
        .hud-actions { display: flex; gap: 8px; pointer-events: auto; }
        .btn-hud { background: rgba(30,41,59,0.85); border: 1px solid #475569; border-radius: 6px; width: 36px; height: 36px; color: #fff; cursor: pointer; font-weight: bold; }
        .ability-bar { display: flex; gap: 6px; background: rgba(0,0,0,0.75); padding: 8px; border-radius: 8px; pointer-events: auto; align-self: center; }
        .btn-ability { width: 68px; height: 44px; background: #1e293b; border: 2px solid #475569; border-radius: 6px; color: #fff; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
        #dialogue-overlay { position: absolute; bottom: 75px; left: 5%; width: 90%; background: rgba(6,10,25,0.95); border: 3px solid #38bdf8; border-radius: 10px; z-index: 8; padding: 12px; display: flex; gap: 15px; align-items: center; pointer-events: auto; }
        .dialogue-portrait { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; }
        .dialogue-body { flex: 1; text-align: left; }
        .dialogue-speaker { font-weight: bold; font-size: 0.9rem; color: #38bdf8; text-transform: uppercase; }
        .dialogue-text { font-size: 0.8rem; color: #f1f5f9; }
        .quiz-container { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
        .btn-answer { background: #1e293b; border: 1px solid #475569; padding: 6px; border-radius: 4px; color: #fff; font-size: 0.75rem; cursor: pointer; text-align: left; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="480"></canvas>

        <!-- START MENU SCREEN -->
        <div id="menu-screen" class="screen">
            <h1>Sonic Custom Engine</h1>
            <div class="roster-grid" id="roster"></div>
            <div class="diff-row">
                <button class="btn-diff selected" data-diff="medium">NORMAL</button>
                <button class="btn-diff" data-diff="scary">SCARY MODE</button>
                <button class="btn-diff" data-diff="quiz">7-YR QUIZ</button>
            </div>
            <button class="btn-start" id="btn-play">Start Game</button>
        </div>

        <!-- HEADS UP DISPLAY HUD -->
        <div id="hud-layer" class="hidden">
            <div class="hud-top">
                <div class="hud-stats">
                    <div>CHARACTER: <span id="hud-char-name" style="color:#38bdf8;">SONIC</span></div>
                    <div>RINGS: <span id="hud-rings" style="color:#facc15;">0</span></div>
                    <div>SCORE: <span id="hud-score" style="color:#4ade80;">0</span></div>
                    <div>SPEED: <span id="hud-speed">0 mph</span></div>
                </div>
                <div class="hud-actions">
                    <button class="btn-hud" id="btn-talk">🎬</button>
                    <button class="btn-hud" id="btn-restart">🔄</button>
                </div>
            </div>

            <!-- POPUP TEXT & QUIZ BOX -->
            <div id="dialogue-overlay" class="hidden">
                <div class="dialogue-portrait" id="diag-portrait"></div>
                <div class="dialogue-body">
                    <div class="dialogue-speaker" id="diag-speaker">SONIC</div>
                    <div class="dialogue-text" id="diag-text">Gotta go fast!</div>
                    <div class="quiz-container hidden" id="diag-quiz-box"></div>
                </div>
            </div>

            <!-- ACTION ABILITY SURGE BAR -->
            <div class="ability-bar">
                <button class="btn-ability" data-index="0">1: DASH</button>
                <button class="btn-ability" data-index="1">2: FLY</button>
                <button class="btn-ability" data-index="2">3: ATTACK</button>
                <button class="btn-ability" data-index="3">4: SHIELD</button>
                <button class="btn-ability" data-index="4">5: HYPER</button>
            </div>
        </div>
    </div>

    <script>
        // Roster data with built-in color configurations
        const ROSTER = [
            { id: "sonic", name: "Sonic", primary: "#0066cc", secondary: "#eab308", line: "Gotta go fast! You can't catch what you can't see!" },
            { id: "shadow", name: "Shadow", primary: "#1e1e1e", secondary: "#dc2626", line: "I am the Ultimate Lifeform. You are wasting my time." },
            { id: "tails", name: "Tails", primary: "#f59e0b", secondary: "#ffffff", line: "I'm not dead! Let's complete the dynamic mission!" },
            { id: "knuckles", name: "Knuckles", primary: "#dc2626", secondary: "#eab308", line: "My fists will shatter your playthings!" },
            { id: "dark_clone", name: "Dark Sonic", primary: "#2e1065", secondary: "#000000", line: "You cannot escape the reach of the void..." }
        ];

        const FACTS_QUIZ = [
            { q: "What is 5 + 2?", a: ["7", "6", "9", "4"], c: 0 },
            { q: "What color is a clean strawberry?", a: ["Blue", "Red", "Green"], c: 1 },
            { q: "Which animal says 'Meow'?", a: ["Dog", "Lion", "Cat"], c: 2 }
        ];

        let appState = "menu"; let chosenCharacter = ROSTER[0]; let currentDifficulty = "medium";
        let score = 0; let rings = 0; let runningDistance = 0; let globalGameSpeed = 0; let targetSpeed = 8;
        let currentQuizIndex = 0; let gravityDirection = 1; let animFrame = 0;

        const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
        let player = { x: 350, y: 292, vy: 0, width: 36, height: 46, isJumping: false, form: "normal", flightTicks: 0 };
        let boss = { x: 650, y: 240, hp: 100, floatOffset: 0 };
        let trackRings = []; let trackObstacles = []; let debrisArray = [];

        // Setup the Character Grid Interface
        const rosterContainer = document.getElementById("roster");
        ROSTER.forEach((char, idx) => {
            const card = document.createElement("div");
            card.className = `char-card ${idx === 0 ? 'selected' : ''}`;
            
            const dot = document.createElement("div");
            dot.className = "char-color-dot";
            dot.style.backgroundColor = char.primary;
            
            const nameEl = document.createElement("div");
            nameEl.className = "char-name";
            nameEl.textContent = char.name;
            
            card.appendChild(dot); card.appendChild(nameEl); rosterContainer.appendChild(card);
            card.addEventListener("click", () => {
                document.querySelectorAll(".char-card").forEach(c => c.classList.remove("selected"));
                card.classList.add("selected"); chosenCharacter = char;
            });
        });

        document.querySelectorAll(".btn-diff").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".btn-diff").forEach(b => b.classList.remove("selected"));
                btn.classList.add("selected"); currentDifficulty = btn.dataset.diff;
});
});
document.getElementById("btn-restart").addEventListener("click", () => { resetLevel(); appState = "play"; });
document.getElementById("btn-talk").addEventListener("click", () => { triggerText(chosenCharacter.name, chosenCharacter.line, false); });
document.getElementById("btn-play").addEventListener("click", () => {
resetLevel(); appState = "play";
document.getElementById("menu-screen").classList.add("hidden");
document.getElementById("hud-layer").classList.remove("hidden");
if (chosenCharacter.id === "tails") { triggerText("Tails", "I'm not dead! Let's complete the dynamic mission!", false); }
});
function triggerText(speaker, text, isQuiz) {
appState = "dialogue"; const overlay = document.getElementById("dialogue-overlay");
overlay.classList.remove("hidden"); document.getElementById("diag-speaker").textContent = speaker;
document.getElementById("diag-text").textContent = text; document.getElementById("diag-portrait").style.backgroundColor = chosenCharacter.primary;
const qBox = document.getElementById("diag-quiz-box"); qBox.innerHTML = ""; qBox.classList.add("hidden");
if (isQuiz) {
qBox.classList.remove("hidden");
FACTS_QUIZ[currentQuizIndex].a.forEach((ans, idx) => {
const btn = document.createElement("button"); btn.className = "btn-answer"; btn.textContent = ans;
btn.addEventListener("click", () => {
if (idx === FACTS_QUIZ[currentQuizIndex].c) { targetSpeed = 18; rings += 5; }
else { gravityDirection *= -1; targetSpeed = 4; }
currentQuizIndex = (currentQuizIndex + 1) % FACTS_QUIZ.length;
appState = "play"; overlay.classList.add("hidden");
});
qBox.appendChild(btn);
});
} else { setTimeout(() => { if(appState === "dialogue") { appState = "play"; overlay.classList.add("hidden"); } }, 2500); }
}
document.querySelectorAll(".btn-ability").forEach(btn => {
btn.addEventListener("click", () => { if (appState === "play") execPower(parseInt(btn.dataset.index)); });
});
window.addEventListener("keydown", (e) => {
if (appState === "play") {
if ((e.key === " " || e.key === "ArrowUp")) { player.vy = -12 * gravityDirection; player.isJumping = true; }
if (["1","2","3","4","5"].includes(e.key)) execPower(parseInt(e.key) - 1);
}
});
function execPower(idx) {
if (idx === 0) targetSpeed = 22;
if (idx === 1) { player.vy = -8 * gravityDirection; player.flightTicks = 50; }
if (idx === 2) debrisArray.push({ x: player.x + 30, y: player.y + 20, vx: 12 });
if (idx === 3) { player.form = "shield"; setTimeout(() => player.form = "normal", 3000); }
if (idx === 4) { player.form = player.form === "hyper" ? "normal" : "hyper"; targetSpeed = player.form === "hyper" ? 28 : 8; }
}
function resetLevel() {
score = 0; rings = 0; runningDistance = 0; globalGameSpeed = 6; targetSpeed = 8; gravityDirection = 1;
player.y = 292; player.vy = 0; player.form = "normal"; player.flightTicks = 0; boss.hp = 100;
trackRings = []; trackObstacles = []; debrisArray = [];
for(let i=0; i<4; i++) {
trackRings.push({ x: 500 + (i * 180), y: 240, active: true });
trackObstacles.push({ x: 700 + (i * 260), y: 316 });
}
document.getElementById("dialogue-overlay").classList.add("hidden");
}
function drawSonicSprite(x, y, color, shoeColor, isHyper) {
ctx.save();
if (isHyper) { ctx.shadowBlur = 20; ctx.shadowColor = hsl(${Date.now() % 360}, 100%, 60%); }
// Draw round animated spinning body legs blur
animFrame += globalGameSpeed * 0.05;
ctx.fillStyle = shoeColor;
let legY = Math.sin(animFrame) * 6;
ctx.beginPath(); ctx.arc(x + 10, y + 42 + legY, 6, 0, Math.PI * 2); ctx.fill();
ctx.beginPath(); ctx.arc(x + 26, y + 42 - legY, 6, 0, Math.PI * 2); ctx.fill();
// Head and Body Fur
ctx.fillStyle = color;
ctx.beginPath(); ctx.arc(x + 18, y + 18, 14, 0, Math.PI * 2); ctx.fill(); // Round Head
ctx.fillRect(x + 8, y + 22, 20, 20); // Torso
// Spikes (Math points to make them look like spikes instead of blocks)
ctx.beginPath();
ctx.moveTo(x + 6, y + 10); ctx.lineTo(x - 8, y + 6); ctx.lineTo(x + 4, y + 18);
ctx.moveTo(x + 4, y + 16); ctx.lineTo(x - 10, y + 16); ctx.lineTo(x + 4, y + 24);
ctx.moveTo(x + 6, y + 22); ctx.lineTo(x - 6, y + 28); ctx.lineTo(x + 10, y + 30);
ctx.fill();
// Face details
ctx.fillStyle = "#fbcfe8"; ctx.beginPath(); ctx.arc(x + 26, y + 22, 6, 0, Math.PI * 2); ctx.fill(); // Muzzle
ctx.fillStyle = isHyper ? "#ff0000" : "#059669"; ctx.fillRect(x + 24, y + 10, 4, 8); // Heroic Eyes
ctx.fillStyle = "#000"; ctx.fillRect(x + 25, y + 12, 2, 4); // Pupil
ctx.restore();
}
function updateEngine() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
if (appState === "play") {
globalGameSpeed += (targetSpeed - globalGameSpeed) * 0.05; runningDistance += globalGameSpeed * 0.1; terrainOffset -= globalGameSpeed;
if (terrainOffset <= -800) terrainOffset = 0;
if (player.form === "hyper" && player.isJumping) { player.vy = -1 * gravityDirection; }
else if (player.flightTicks > 0) { player.vy = -1.5 * gravityDirection; player.flightTicks--; }
else { player.vy += 0.55 * gravityDirection; }
player.y += player.vy;
if (gravityDirection === 1 && player.y >= 292) { player.y = 292; player.isJumping = false; }
if (gravityDirection === -1 && player.y <= 60) { player.y = 60; player.isJumping = false; }
if (currentDifficulty === "quiz" && Math.floor(runningDistance) % 500 === 0 && Math.floor(runningDistance) > 0) {
triggerText("QUIZ ENGINE", FACTS_QUIZ[currentQuizIndex].q, true);
}
}
// Draw Sky Backdrop
let sky = ctx.createLinearGradient(0,0,0, canvas.height);
sky.addColorStop(0, currentDifficulty === "scary" ? "#1a0000" : "#0c4a6e"); sky.addColorStop(1, "#050508");
ctx.fillStyle = sky; ctx.fillRect(0,0, canvas.width, canvas.height);
// Draw Checkered Loop Ground track
ctx.fillStyle = currentDifficulty === "scary" ? "#3f0000" : "#b45309"; ctx.fillRect(0, 340, canvas.width, 140);
ctx.fillStyle = currentDifficulty === "scary" ? "#110000" : "#15803d"; ctx.fillRect(0, 340, canvas.width, 16);
// Draw properly rendered Sonic Shape Character
let bodyColor = currentDifficulty === "scary" ? "#000000" : chosenCharacter.primary;
let bootColor = currentDifficulty === "scary" ? "#ff0000" : chosenCharacter.secondary;
if (player.form === "hyper") bodyColor = hsl(${Date.now() % 360}, 100%, 70%);
drawSonicSprite(player.x, player.y, bodyColor, bootColor, player.form === "hyper");
if(player.form === "shield") { ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(player.x+18, player.y+24, 30, 0, Math.PI*2); ctx.stroke(); }
// Render Eggman Boss Craft
boss.floatOffset += 0.05; let bY = boss.y + (Math.sin(boss.floatOffset) * 12);
ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.arc(640, bY, 26, 0, Math.PI*2); ctx.fill(); // Eggmobile capsule hull
ctx.fillStyle = "#94a3b8"; ctx.fillRect(610, bY, 60, 16); // Metal canopy rims
// Collisions loops logic checks
trackRings.forEach(r => {
if(appState === "play") r.x -= globalGameSpeed; if(r.x < -20) r.x = canvas.width + 200;
if(r.active && Math.abs(player.x - r.x) < 30 && Math.abs(player.y - r.y) < 40) { r.active = false; rings++; score += 100; playBeep(600, "sine", 0.05); }
if(r.active) { ctx.fillStyle = "#eab308"; ctx.beginPath(); ctx.arc(r.x, r.y, 8, 0, Math.PI2); ctx.fill(); }
});
trackObstacles.forEach(o => {
if(appState === "play") o.x -= globalGameSpeed; if(o.x < -20) o.x = canvas.width + 300;
if(Math.abs(player.x - o.x) < 24 && Math.abs(player.y - o.y) < 40) { o.x = canvas.width + 400; if(player.form !== "shield" && player.form !== "hyper") rings = 0; playBeep(150, "triangle", 0.2); }
ctx.fillStyle = "#475569"; ctx.fillRect(o.x, o.y, 24, 24);
});
debrisArray.forEach((d, i) => {
d.x += d.vx; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(d.x, d.y, 6, 0, Math.PI2); ctx.fill();
if(d.x > 620 && Math.abs(d.y - bY) < 40) { boss.hp -= 10; score += 1000; debrisArray.splice(i, 1); playBeep(700, "square", 0.05); }
});
document.getElementById("hud-rings").textContent = rings;
document.getElementById("hud-score").textContent = score;
document.getElementById("hud-speed").textContent = ${Math.floor(globalGameSpeed * 5)} mph;
requestAnimationFrame(updateEngine);
}
updateEngine();
