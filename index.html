}
function collideGround(){if(player.y>=ground()-player.r){player.y=ground()-player.r;player.vy=0;player.onGround=true;player.jumps=0}}
function update(dt){

 player.vy+=.82*dt*60;if(player.fly>0){player.fly-=dt;player.vy*=.86}

 enemies.forEach(e=>{

       else if(player.inv<=0){player.hp-=20;player.inv=1;player.vx=-player.vx*.4}
       if(e.hp<=0){e.alive=0;score+=50000;burst(e.x,e.y,180,4,"hyper")}
     }else if(Math.abs(player.vx)>15||hero!==0){e.alive=0;score+=300;combo++;player.vy=-11;burst(e.x,e.y,25,1.2,"enemy")}
     else if(player.inv<=0){player.hp-=10;player.inv=.9;player.vx=-player.vx*.6}
   }
 });
 particles.forEach(q=>{
   q.x+=q.vx*dt*4;q.y+=q.vy*dt*4;q.life-=dt;q.vy+=.16;
   if(q.k==="bolt"&&player.inv<=0&&Math.hypot(player.x-q.x,player.y-q.y)<player.r+q.r){q.life=0;player.hp-=16;player.inv=.8;burst(player.x,player.y,12,.7,"hit")}
   if(["ki","orange","bubble","carrot","magic","sword","blue","green","purple","ghost","gold"].includes(q.k)){
     for(const e of enemies)if(e.alive&&Math.hypot(e.x-q.x,e.y-q.y)<e.r+q.r){q.life=0;if(e.b)e.hp-=2;else e.alive=0;score+=e.b?400:350;burst(e.x,e.y,12,1,e.b?"boss":"enemy");break}
   }
 });
 particles=particles.filter(q=>q.life>0);
 cam=Math.max(0,Math.min(36000-W,player.x-W*.30));
 if(!boss.alive&&player.x>35800){won=true;show(true,"INFINITE CHAOS CLEARED!","Score "+score.toLocaleString()+" • Rings "+ringCount+" • Press R to replay")}
 if(player.hp<=0)show(true,"GAME OVER","Press R to restart");
 document.getElementById("mission").textContent=boss.alive&&player.x>boss.x-1200?`FINAL BOSS · TITAN CORE ${Math.max(0,boss.hp)}/${boss.max}`:`MISSION · Collect 80 Rings: ${Math.min(80,ringCount)}/80`;

}
function sx(x){return x-cam}
function draw(){
 ctx.clearRect(0,0,W,H);const gy=ground();
 let sky=ctx.createLinearGradient(0,0,0,gy);sky.addColorStop(0,"#4bc7ff");sky.addColorStop(1,"#e8fbff");ctx.fillStyle=sky;ctx.fillRect(0,0,W,gy);
 ctx.fillStyle="rgba(255,250,190,.75)";ctx.beginPath();ctx.arc(W*.78,H*.16,62,0,7);ctx.fill();
 for(let layer=0;layer<3;layer++){ctx.fillStyle=["#8bb69d","#5f9274","#3e684f"][layer];let off=cam*.08*(layer+1);for(let x=-700-off;x<W+700;x+=620){ctx.beginPath();ctx.moveTo(x,gy-layer*20);ctx.lineTo(x+150,gy-130-layer*25);ctx.lineTo(x+310,gy-45-layer*15);ctx.lineTo(x+460,gy-160-layer*28);ctx.lineTo(x+620,gy);ctx.lineTo(x+620,H);ctx.lineTo(x,H);ctx.closePath();ctx.fill()}}
 ctx.fillStyle="#217c9b";ctx.fillRect(0,gy+10,W,H-gy-10);
 ctx.fillStyle="#1e412b";ctx.fillRect(0,gy,W,25);ctx.fillStyle="#5d9f54";ctx.fillRect(0,gy,W,9);
 for(let x=Math.floor(cam/650)*650;x<cam+W+800;x+=650){let xx=sx(x);ctx.fillStyle="#75878b";ctx.fillRect(xx,gy-270,58,270);ctx.fillStyle="#aab8bb";ctx.fillRect(xx-10,gy-282,78,16)}
 for(let x=-400-(cam%700);x<W+800;x+=700){ctx.strokeStyle="rgba(250,255,255,.4)";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,gy-230);ctx.quadraticCurveTo(x+240,gy-330,x+500,gy-190);ctx.stroke()}
 rings.forEach(q=>{if(q.got)return;let x=sx(q.x);if(x<-30||x>W+30)return;ctx.strokeStyle="#ffd94a";ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(x,q.y, q.r*(.35+.65*Math.abs(Math.cos(q.a))),q.r,0,0,7);ctx.stroke()});
 enemies.forEach(e=>{if(!e.alive)return;let x=sx(e.x);if(x<-100||x>W+100)return;ctx.save();ctx.translate(x,e.y);if(e.b)drawBoss();else drawEnemy(e);ctx.restore()});
 particles.forEach(q=>{const colors={blue:"#5bc7ff",gold:"#ffe154",hyper:"#fff",purple:"#bd8dff",red:"#ff5555",pink:"#ff9ec0",ki:"#a9e6ff",orange:"#ff9b3a",green:"#52ee6a",bubble:"#a9efff",carrot:"#ef8e3d",magic:"#fff1aa",sword:"#c4ebff",ghost:"#e4fbff",ring:"#ffdb52",enemy:"#ff7777",boss:"#f4a1ff",hit:"#ffe0e0",spark:"#e7f6ff",jump:"#d8f3ff",switch:"#fff",bolt:"#ff6cff"};ctx.globalAlpha=Math.min(1,Math.max(0,q.life*2));ctx.fillStyle=colors[q.k]||"#fff";ctx.beginPath();ctx.arc(sx(q.x),q.y,q.r,0,7);ctx.fill();ctx.globalAlpha=1});
 drawPlayer();
 document.getElementById("statsText").innerHTML=`<b>${HEROES[hero][0]}</b> · ${HEROES[hero][3]} · <b>${HEROES[hero][4]}</b><br>Speed <b>${hero===0||hero===1||hero===2||hero===6?"∞":HEROES[hero][1]}</b> · Score <b>${score.toLocaleString()}</b> · Rings <b>${ringCount}</b> · HP <b>${Math.max(0,player.hp)}</b><br><span style="opacity:.76">A/D or ←/→ · Space jump · Shift boost · E power · Q switch · R restart</span>`;
}
function drawEnemy(e){
 ctx.fillStyle=["#b52d37","#3b56ad","#7a3e8d","#50565f","#2d8b50"][e.type%5]||"#555";ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-9,-7,5,0,7);ctx.arc(9,-7,5,0,7);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(-8,-7,2,0,7);ctx.arc(8,-7,2,0,7);ctx.fill();
}
function drawBoss(){ctx.fillStyle="#54225d";ctx.beginPath();ctx.arc(0,0,boss.r,0,7);ctx.fill();ctx.fillStyle="#252a35";ctx.fillRect(-48,-30,96,60);ctx.fillStyle="#e64bef";ctx.beginPath();ctx.arc(0,-8,18,0,7);ctx.fill();ctx.strokeStyle="#ff9bff";ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,boss.r+13,0,7);ctx.stroke()}
function drawPlayer(){
 const h=HEROES[hero],x=sx(player.x),y=player.y;
 for(let i=0;i<player.trail.length;i++){let t=player.trail[i];ctx.globalAlpha=i/player.trail.length*.32;ctx.fillStyle=h[2];ctx.beginPath();ctx.arc(sx(t.x),t.y,17+i,0,7);ctx.fill()}ctx.globalAlpha=1;
 ctx.save();ctx.translate(x,y);if(player.vx<-.2)ctx.scale(-1,1);
 if(hero<=2||hero===6){
   ctx.fillStyle=hero===6?"#131722":h[2];ctx.beginPath();ctx.moveTo(-11,-22);ctx.lineTo(-44,-42);ctx.lineTo(-28,-10);ctx.lineTo(-52,-18);ctx.lineTo(-26,4);ctx.lineTo(-43,19);ctx.lineTo(-4,14);ctx.closePath();ctx.fill();
   ctx.fillStyle=h[2];ctx.beginPath();ctx.arc(0,0,29,0,7);ctx.fill();
 }else{ctx.fillStyle=h[2];ctx.beginPath();ctx.arc(0,0,29,0,7);ctx.fill()}
 ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(11,-7,15,20,0,0,7);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(15,-10,4,0,7);ctx.fill();
 ctx.fillStyle=hero===6?"#e63434":"#d93034";ctx.fillRect(-23,20,20,10);ctx.fillRect(4,20,20,10);ctx.fillStyle="#fff";ctx.fillRect(-26,13,28,7);ctx.fillRect(2,13,28,7);
 if(player.inv>0){ctx.strokeStyle="rgba(255,255,255,.82)";ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,46,0,7);ctx.stroke()}
 ctx.restore();
 ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(x-58,y-75,116,21);ctx.fillStyle="#fff";ctx.font="900 12px Arial";ctx.textAlign="center";ctx.fillText(h[0],x,y-60);ctx.textAlign="left";
}
function show(on,a,b){center(on,a,b)}

</script>
