<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Ultimate Custom Engine - Play Free Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', sans-serif; }
        body { background: #050508; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 800px; height: 480px; background: #000; border: 4px solid #1e293b; border-radius: 12px; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(10, 15, 30, 0.95); z-index: 10; padding: 20px; }
        .hidden { display: none !important; }
        h1 { font-size: 2.2rem; margin-bottom: 12px; color: #38bdf8; text-transform: uppercase; }
        .setup-area { display: flex; gap: 20px; width: 100%; max-height: 260px; margin-bottom: 15px; }
        .roster-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; overflow-y: auto; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 8px; border: 1px solid #334155; }
        .char-card { background: #1e293b; border: 2px solid transparent; border-radius: 6px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .char-card.selected { border-color: #38bdf8; background: #0369a1; }
        .char-preview-thumb { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; margin-bottom: 4px; display: inline-block; }
        .char-name { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        .customizer-panel { width: 220px; background: rgba(30, 41, 59, 0.8); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .color-row { display: flex; flex-direction: column; gap: 2px; }
        .color-row input[type="color"] { width: 100%; height: 24px; border: none; border-radius: 4px; cursor: pointer; }
        .diff-row { display: flex; gap: 6px; margin-bottom: 15px; }
        .btn-diff { background: #334155; border: 1px solid #475569; padding: 6px 12px; font-size: 0.75rem; border-radius: 6px; color: #cbd5e1; cursor: pointer; font-weight: bold; }
        .btn-diff.selected { border-color: #38bdf8; color: #fff; background: #2563eb; }
        .btn-start { background: #2563eb; color: #fff; border: none; padding: 10px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        #hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .hud-top { display: flex; justify-content: space-between; width: 100%; }
        .hud-stats { background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; }
        .hud-actions { display: flex; gap: 8px; pointer-events: auto; }
        .btn-hud { background: rgba(30,41,59,0.85); border: 1px solid #475569; border-radius: 6px; width: 36px; height: 36px; color: #fff; cursor: pointer; }
        .ability-bar { display: flex; gap: 6px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 8px; pointer-events: auto; align-self: center; }
        .btn-ability { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 66px; height: 52px; background: #1e293b; border: 2px solid #475569; border-radius: 6px; color: #fff; cursor: pointer; font-size: 0.65rem; font-weight: bold; }
        #dialogue-overlay { position: absolute; bottom: 85px; left: 5%; width: 90%; background: rgba(6,10,25,0.95); border: 3px solid #38bdf8; border-radius: 10px; z-index: 8; padding: 12px; display: flex; gap: 15px; align-items: center; pointer-events: auto; }
        .dialogue-portrait { width: 55px; height: 55px; border-radius: 8px; border: 2px solid #fff; }
        .dialogue-body { flex: 1; text-align: left; }
        .dialogue-speaker { font-weight: bold; font-size: 0.9rem; color: #38bdf8; }
        .dialogue-text { font-size: 0.8rem; color: #f1f5f9; }
        .quiz-container { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
        .btn-answer { background: #1e293b; border: 1px solid #475569; padding: 6px; border-radius: 4px; color: #fff; font-size: 0.75rem; cursor: pointer; }
        #scary-filter { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(220,38,38,0.12); pointer-events:none; z-index: 6; mix-blend-mode: color-burn; }
        #scary-static { position: absolute; top:0; left:0; width:100%; height:100%; background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://w3.org"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E'); opacity: 0.07; pointer-events:none; z-index:7; }
    </style>
</head>
<body>
    <div id="scary-filter" class="hidden"></div>
    <div id="scary-static" class="hidden"></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="480"></canvas>
        <div id="menu-screen" class="screen">
            <h1>Sonic Custom Engine</h1>
            <div class="setup-area">
                <div class="roster-grid" id="roster"></div>
                <div class="customizer-panel">
                    <h3>Skin Customizer</h3>
                    <div class="color-row"><label>Body:</label><input type="color" id="color-body" value="#0066cc"></div>
                    <div class="color-row"><label>Accent:</label><input type="color" id="color-accent" value="#ffffff"></div>
                    <div class="color-row"><label>Shoes:</label><input type="color" id="color-shoes" value="#cc0000"></div>
                </div>
            </div>
            <div class="diff-row">
                <button class="btn-diff selected" data-diff="medium">NORMAL</button>
                <button class="btn-diff" data-diff="scary">SCARY MODE</button>
                <button class="btn-diff" data-diff="quiz">7-YR QUIZ</button>
            </div>
            <button class="btn-start" id="btn-play">Start Game</button>
        </div>
        <div id="hud-layer" class="hidden">
            <div class="hud-top">
                <div class="hud-stats">
                    <div>CHARACTER: <span id="hud-char-name">SONIC</span></div>
                    <div>RINGS: <span id="hud-rings">0</span></div>
                    <div>SCORE: <span id="hud-score">0</span></div>
                    <div>SPEED: <span id="hud-speed">0 mph</span></div>
                </div>
                <div class="hud-actions">
                    <button class="btn-hud" id="btn-story-trigger">🎬</button>
                    <button class="btn-hud" id="btn-mute">🔊</button>
                    <button class="btn-hud" id="btn-restart">🔄</button>
                </div>
            </div>
            <div id="dialogue-overlay" class="hidden">
                <div class="dialogue-portrait" id="diag-portrait"></div>
                <div class="dialogue-body">
                    <div class="dialogue-speaker" id="diag-speaker">SONIC</div>
                    <div class="dialogue-text" id="diag-text">Gotta go fast!</div>
                    <div class="quiz-container hidden" id="diag-quiz-box"></div>
                </div>
            </div>
            <div class="ability-bar">
                <button class="btn-ability" data-index="0">1: DASH</button>
                <button class="btn-ability" data-index="1">2: FLY</button>
                <button class="btn-ability" data-index="2">3: ATTACK</button>
                <button class="btn-ability" data-index="3">4: SHIELD</button>
                <button class="btn-ability" data-index="4">5: HYPER</button>
            </div>
        </div>
    </div>
    <script>
        const ROSTER = [
            { id: "sonic", name: "Sonic", fur: "#0066cc", accent: "#e2e8f0", shoes: "#cc0000", line: "Gotta go fast! You can't catch what you can't see!" },
            { id: "shadow", name: "Shadow", fur: "#1e1e1e", accent: "#dc2626", shoes: "#ffffff", line: "I am the Ultimate Lifeform. You are wasting my time." },
            { id: "tails", name: "Tails", fur: "#eab308", accent: "#ffffff", shoes: "#cc0000", line: "I'm not dead! Let's complete the dynamic mission!" },
            { id: "dark_clone", name: "Dark Sonic Clone", fur: "#2e1065", accent: "#000000", shoes: "#4c1d95", line: "You cannot escape the reach of the dark void glitches..." }
        ];
        const FACTS_QUIZ = [
            { q: "What is 4 + 3?", a: ["7", "6", "9", "5"], c: 0 },
            { q: "Spell the color: 🔴", a: ["Blue", "Red", "Green", "Pink"], c: 1 },
            { q: "King of the Jungle?", a: ["Monkey", "Elephant", "Lion", "Giraffe"], c: 2 }
        ];
        let appState = "menu"; let chosenCharacter = ROSTER[0]; let currentDifficulty = "medium";
        let score = 0; let rings = 0; let runningDistance = 0; let globalGameSpeed = 0; let targetSpeed = 8;
        let audioMuted = false; let currentQuizIndex = 0; let gravityDirection = 1;
        let customColors = { fur: "#0066cc", accent: "#ffffff", shoes: "#cc0000" };
        const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
        let player = { x: 384, y: 292, vx: 0, vy: 0, width: 32, height: 48, isJumping: false, form: "normal", flightTicks: 0 };
        let boss = { x: 650, y: 260, hp: 100, maxHp: 100, floatOffset: 0 };
        let particlesArray = []; let debrisArray = []; let trackRings = []; let trackObstacles = []; let terrainOffset = 0;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, type, duration) {
            if (audioMuted) return;
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = type || "sine"; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }
        const rosterContainer = document.getElementById("roster");
        ROSTER.forEach((char, idx) => {
            const card = document.createElement("div"); card.className = `char-card ${idx === 0 ? 'selected' : ''}`;
            const thumb = document.createElement("span"); thumb.className = "char-preview-thumb"; thumb.style.backgroundColor = char.fur;
            const nameEl = document.createElement("div"); nameEl.className = "char-name"; nameEl.textContent = char.name;
            card.appendChild(thumb); card.appendChild(nameEl); rosterContainer.appendChild(card);
            card.addEventListener("click", () => {
                document.querySelectorAll(".char-card").forEach(c => c.classList.remove("selected")); card.classList.add("selected");
                chosenCharacter = char; document.getElementById("color-body").value = char.fur;
                document.getElementById("color-accent").value = char.accent; document.getElementById("color-shoes").value = char.shoes;
                updateColorsFromInputs();
            });
        });
        document.querySelectorAll(".btn-diff").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".btn-diff").forEach(b => b.classList.remove("selected")); btn.classList.add("selected");
                currentDifficulty = btn.dataset.diff;
                document.getElementById("scary-filter").className = currentDifficulty === "scary" ? "" : "hidden";
                document.getElementById("scary-static").className = currentDifficulty === "scary" ? "" : "hidden";
            });
        });
        function updateColorsFromInputs() {
            customColors.fur = document.getElementById("color-body").value;
            customColors.accent = document.getElementById("color-accent").value;
            customColors.shoes = document.getElementById("color-shoes").value;
        }
        document.getElementById("btn-mute").addEventListener("click", () => { audioMuted = !audioMuted; });
        document.getElementById("btn-restart").addEventListener("click", () => { resetLevelState(); appState = "play"; });
        document.getElementById("btn-story-trigger").addEventListener("click", () => { triggerDialogue(chosenCharacter.name, chosenCharacter.line, false); });
        document.getElementById("btn-play").addEventListener("click", () => {
            updateColorsFromInputs(); resetLevelState(); appState = "play";
            document.getElementById("menu-screen").classList.add("hidden"); document.getElementById("hud-layer").classList.remove("hidden");
            if (chosenCharacter.id === "tails") { triggerDialogue("Tails", "I'm not dead! Let's complete the dynamic mission!", false); }
        });
        function triggerDialogue(speaker, text, isQuiz) {
            appState = "dialogue"; const box = document.getElementById("dialogue-overlay");
            box.classList.remove("hidden"); document.getElementById("diag-speaker").textContent = speaker;
            document.getElementById("diag-text").textContent = text; document.getElementById("diag-portrait").style.backgroundColor = customColors.fur;
            const qBox = document.getElementById("diag-quiz-box"); qBox.innerHTML = ""; qBox.classList.add("hidden");
            if (isQuiz) {
                qBox.classList.remove("hidden");
                FACTS_QUIZ[currentQuizIndex].a.forEach((ans, idx) => {
                    const btn = document.createElement("button"); btn.className = "btn-answer"; btn.textContent = ans;
                    btn.addEventListener("click", () => {
                        if (idx === FACTS_QUIZ[currentQuizIndex].c) { targetSpeed = 16; rings += 5; } 
                        else { gravityDirection *= -1; targetSpeed = 4; }
                        currentQuizIndex = (currentQuizIndex + 1) % FACTS_QUIZ.length;
                        appState = "play"; box.classList.add("hidden");
                    });
                    qBox.appendChild(btn);
                });
            } else { setTimeout(() => { if(appState === "dialogue") { appState = "play"; box.classList.add("hidden"); } }, 2500); }
        }
        document.querySelectorAll(".btn-ability").forEach(btn => {
            btn.addEventListener("click", () => { if (appState === "play") execAbility(parseInt(btn.dataset.index)); });
        });
        window.addEventListener("keydown", (e) => {
            if (appState === "play") {
                if (e.key === " " || e.key === "ArrowUp") { player.vy = -12 * gravityDirection; player.isJumping = true; }
                if (["1","2","3","4","5"].includes(e.key)) execAbility(parseInt(e.key) - 1);
            }
        });
        function execAbility(idx) {
            if (idx === 0) targetSpeed = 20;
            if (idx === 1) { player.vy = -7 * gravityDirection; player.flightTicks = 45; }
            if (idx === 2) debrisArray.push({ x: player.x + 20, y: player.y + 16, vx: 10, vy: 0 });
            if (idx === 3) { player.form = "shield"; setTimeout(() => player.form = "normal", 3000); }
            if (idx === 4) { player.form = player.form === "hyper" ? "normal" : "hyper"; targetSpeed = player.form === "hyper" ? 25 : 8; }
        }
        function resetLevelState() {
            score = 0; rings = 0; runningDistance = 0; globalGameSpeed = 6; targetSpeed = 8; gravityDirection = 1;
            player.y = 292; player.vy = 0; player.form = "normal"; player.flightTicks = 0; boss.hp = 100;
            trackRings = []; trackObstacles = []; debrisArray = [];
            for(let i=0; i<4; i++) {
                trackRings.push({ x: 500 + (i * 160), y: 250, active: true });
                trackObstacles.push({ x: 700 + (i * 260), y: 316 });
            }
        }
        function updateEngineFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (appState === "play") {
                globalGameSpeed += (targetSpeed - globalGameSpeed) * 0.05; runningDistance += globalGameSpeed * 0.1; terrainOffset -= globalGameSpeed;
                if (terrainOffset <= -800) terrainOffset = 0;
                if (player.form === "hyper" && player.isJumping) { player.vy = -1 * gravityDirection; } 
                else if (player.flightTicks > 0) { player.vy = -1.5 * gravityDirection; player.flightTicks--; } 
                else { player.vy += 0.5 * gravityDirection; }
                player.y += player.vy;
                if (gravityDirection === 1 && player.y >= 292) { player.y = 292; player.isJumping = false; }
                if (gravityDirection === -1 && player.y <= 60) { player.y = 60; player.isJumping = false; }
                if (currentDifficulty === "quiz" && Math.floor(runningDistance) % 600 === 0 && Math.floor(runningDistance) > 0) {
                    triggerDialogue("QUIZ STATION", FACTS_QUIZ[currentQuizIndex].q, true);
                }
            }
            // Render Background & Ground
            let sky = ctx.createLinearGradient(0,0,0, canvas.height);
            sky.addColorStop(0, currentDifficulty === "scary" ? "#1a0000" : "#0c4a6e");
            sky.addColorStop(1, "#000");
            ctx.fillStyle = sky; ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = currentDifficulty === "scary" ? "#3f0000" : "#b45309"; ctx.fillRect(0, 340, canvas.width, 140);
            // Render Player
            ctx.fillStyle = currentDifficulty === "scary" ? "#000" : customColors.fur; ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = customColors.shoes; ctx.fillRect(player.x - 2, player.y + (gravityDirection === 1 ? 40 : -2), 36, 10);
            if(player.form === "shield") { ctx.strokeStyle = "#38bdf8"; ctx.beginPath(); ctx.arc(player.x+16, player.y+24, 30, 0, Math.PI*2); ctx.stroke(); }
            // Render Boss
            boss.floatOffset += 0.05; let bY = boss.y + (Math.sin(boss.floatOffset) * 10);
            ctx.fillStyle = "#dc2626"; ctx.beginPath(); ctx.arc(640, bY, 30, 0, Math.PI*2); ctx.fill();
            // Game Objects Loops
            trackRings.forEach(r => {
                if(appState === "play") r.x -= globalGameSpeed; if(r.x < -20) r.x = canvas.width + 200;
                if(r.active && Math.abs(player.x - r.x) < 30 && Math.abs(player.y - r.y) < 40) { r.active = false; rings++; score += 100; }
                if(r.active) { ctx.fillStyle = "#eab308"; ctx.beginPath(); ctx.arc(r.x, r.y, 8, 0, Math.PI*2); ctx.fill(); }
            });
            trackObstacles.forEach(o => {
                if(appState === "play") o.x -= globalGameSpeed; if(o.x < -20) o.x = canvas.width + 300;
                if(Math.abs(player.x - o.x) < 24 && Math.abs(player.y - o.y) < 40) { if(player.form !== "shield" && player.form !== "hyper") rings = 0; }
                ctx.fillStyle = "#475569"; ctx.fillRect(o.x, o.y, 24, 24);
            });
            debrisArray.forEach((d, i) => {
                d.x += d.vx; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(d.x, d.y, 6, 0, Math.PI*2); ctx.fill();
                if(d.x > 620 && Math.abs(d.y - bY) < 40) { boss.hp -= 10; score += 1000; debrisArray.splice(i, 1); }
            });
            document.getElementById("hud-rings").textContent = rings;
            document.getElementById("hud-score").textContent = score;
            document.getElementById("hud-speed").textContent = `${Math.floor(globalGameSpeed * 5)} mph`;
            requestAnimationFrame(updateEngineFrame);
        }
        updateEngineFrame();
    </script>
</body>
</html>
