<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultimate Mod Chaos</title>
<style>
html,body{margin:0;overflow:hidden;background:#07101d;color:white;font-family:Arial}
canvas{display:block}
#ui{
 position:fixed;top:12px;left:12px;z-index:5;
 font-weight:bold;font-size:18px;
 text-shadow:2px 2px #000;line-height:1.5
}
#help{
 position:fixed;right:12px;bottom:12px;z-index:5;
 text-align:right;text-shadow:2px 2px #000
}
#boss{
 position:fixed;top:15px;left:25%;width:50%;height:22px;
 border:2px solid white;background:#222;display:none;z-index:5
}
#bossHP{height:100%;background:#9b35ff;width:100%}
#message{
 position:fixed;top:45%;width:100%;text-align:center;
 font-size:34px;font-weight:bold;text-shadow:3px 3px #000;
 pointer-events:none;z-index:6
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="ui">
⚡ Speed: <span id="speed">0</span><br>
💍 Rings: <span id="rings">0</span><br>
❤️ HP: <span id="hp">100</span><br>
🏆 Score: <span id="score">0</span><br>
🌟 Form: <span id="form">Normal</span>
</div>

<div id="boss"><div id="bossHP"></div></div>

<div id="message"></div>

<div id="help">
A/D or ←/→ = Move<br>
W / Space = Jump<br>
Shift = Boost<br>
E = Attack<br>
1 = Super Sonic<br>
2 = Hyper Sonic<br>
R = Restart
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
 canvas.width=innerWidth;
 canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const keys={};

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;

 if([" ","arrowleft","arrowright"].includes(e.key.toLowerCase()))
   e.preventDefault();

 if(e.key.toLowerCase()==="1")superSonic();
 if(e.key.toLowerCase()==="2")hyperSonic();
 if(e.key.toLowerCase()==="r")location.reload();
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

const WORLD_WIDTH=16000;
const GROUND=540;

let camera=0;
let darkness=0;
let eventTimer=900;
let messageTimer=0;

let player={
 x:200,
 y:450,
 vx:0,
 vy:0,
 radius:24,
 hp:100,
 rings:0,
 score:0,
 grounded:false,
 form:"Normal",
 invincible:false
};

let blocks=[];
let rings=[];
let particles=[];
let enemies=[];
let boss=null;

/* Minecraft-style terrain */

for(let i=0;i<220;i++){
 let h=30+Math.random()*130;

 blocks.push({
   x:300+i*75+Math.random()*25,
   y:GROUND-h,
   w:55+Math.random()*35,
   h:h
 });
}

/* Rings */

for(let i=0;i<160;i++){
 rings.push({
   x:400+i*90+Math.random()*70,
   y:180+Math.random()*260,
   taken:false
 });
}

/* Mowzie-style creatures */

function spawnMowzie(x,type){
 enemies.push({
   x:x,
   y:GROUND-60,
   type:type,
   hp:type==="Frostmaw"?350:180,
   max:type==="Frostmaw"?350:180,
   vx:0,
   attack:0
 });
}

spawnMowzie(1800,"Frostmaw");
spawnMowzie(3600,"Wroughtnaut");
spawnMowzie(5500,"Umvuthi");
spawnMowzie(7500,"Barako");

/* particles */

function particle(x,y,color,count=10){

 for(let i=0;i<count;i++){

  particles.push({
   x:x,
   y:y,
   vx:(Math.random()-.5)*10,
   vy:(Math.random()-1)*9,
   life:45,
   color:color
  });

 }
}

/* messages */

function message(text,time=2000){
 document.getElementById("message").innerHTML=text;
 messageTimer=time;
}

/* forms */

function superSonic(){

 if(player.rings>=50){

  player.form="SUPER";
  player.invincible=true;
  message("🌟 SUPER SONIC!",1800);

 }else{

  message("Need 50 Rings!",1200);

 }
}

function hyperSonic(){

 if(player.rings>=100){

  player.form="HYPER";
  player.invincible=true;
  message("⚡🌟 HYPER SONIC!",2200);

 }else{

  message("Need 100 Rings!",1200);

 }
}

/* Verity event */

function verityEvent(){

 message("👁️ VERITY EVENT — THE WORLD CHANGES!",2500);

 darkness=35;

 particle(
   player.x+300,
   250,
   "#ffd92e",
   50
 );

}

/* Twisted Warden */

function summonWarden(){

 boss={
   x:player.x+1000,
   y:GROUND-100,
   hp:1000,
   max:1000,
   vx:-2,
   timer:0
 };

 document.getElementById("boss").style.display="block";

 message(
   "☠️ TWISTED WARDEN HAS ARRIVED!",
   3000
 );
}

/* update */

function update(){

 let left=keys["a"]||keys["arrowleft"];
 let right=keys["d"]||keys["arrowright"];

 let boost=keys["shift"];

 let maxSpeed;

 if(player.form==="HYPER")
   maxSpeed=55;
 else if(player.form==="SUPER")
   maxSpeed=35;
 else
   maxSpeed=boost?25:12;

 if(left)player.vx-=.9;
 if(right)player.vx+=.9;

 if(!left&&!right)
   player.vx*=.91;

 player.vx=Math.max(
   -maxSpeed,
   Math.min(maxSpeed,player.vx)
 );

 /* jump */

 if(
   (keys["w"]||keys[" "]) &&
   player.grounded
 ){

   player.vy=-16;
   player.grounded=false;

 }

 player.vy+=.72;
 player.y+=player.vy;

 /* terrain */

 let terrainHeight=0;

 for(const b of blocks){

  if(
   player.x+player.radius>b.x &&
   player.x-player.radius<b.x+b.w &&
   player.y+player.radius>=b.y &&
   player.y< b.y
  ){

   terrainHeight=b.h;
   break;

  }

 }

 let floor=GROUND-terrainHeight;

 if(player.y+player.radius>=floor){

   player.y=floor-player.radius;
   player.vy=0;
   player.grounded=true;

 }else{

   player.grounded=false;

 }

 player.x+=player.vx;

 player.x=Math.max(
   40,
   Math.min(WORLD_WIDTH-40,player.x)
 );

 /* boost trail */

 if(boost && Math.abs(player.vx)>18)
   particle(player.x-25,player.y,"#44ddff",2);

 /* rings */

 for(const ring of rings){

  if(!ring.taken){

   let d=Math.hypot(
    ring.x-player.x,
    ring.y-player.y
   );

   if(d<42){

    ring.taken=true;
    player.rings++;
    player.score+=10;

    particle(
     ring.x,
     ring.y,
     "#ffd92e",
     12
    );

   }

  }

 }

 /* Mowzie mobs */

 for(const enemy of enemies){

  let distance=player.x-enemy.x;

  enemy.attack++;

  if(Math.abs(distance)<900){

   enemy.vx=Math.sign(distance)*1.2;
   enemy.x+=enemy.vx;

   if(
     Math.abs(distance)<90 &&
     enemy.attack%70===0 &&
     !player.invincible
   ){

     player.hp-=10;

   }

   if(
     keys["e"] &&
     Math.abs(distance)<130
   ){

     enemy.hp-=player.form==="HYPER"?25:
               player.form==="SUPER"?15:8;

     player.score+=2;

     particle(
      enemy.x,
      enemy.y,
      "#ffffff",
      8
     );

   }

  }

 }

 enemies=enemies.filter(e=>{

  if(e.hp<=0){

   player.score+=500;

   message(
    "🏆 "+e.type+" DEFEATED!",
    1300
   );

   return false;

  }

  return true;

 });

 /* Verity timer */

 eventTimer--;

 if(eventTimer<=0){

  eventTimer=
    1100+
    Math.random()*1000;

  verityEvent();

 }

 if(darkness>0)
   darkness-=.02;

 /* Warden trigger */

 if(
   !boss &&
   player.score>=1500
 ){

   summonWarden();

 }

 /* Warden */

 if(boss){

  boss.timer++;

  boss.x+=boss.vx;

  if(
   boss.x<player.x-600 ||
   boss.x>player.x+1000
  ){

   boss.vx*=-1;

  }

  /* attack */

  if(
   Math.random()<.025
  ){

   particle(
    boss.x,
    boss.y,
    "#a43cff",
    25
   );

  }

  /* player attack */

  if(
   keys["e"] &&
   Math.abs(player.x-boss.x)<170
  ){

   let damage=
    player.form==="HYPER"?12:
    player.form==="SUPER"?8:4;

   boss.hp-=damage;
   player.score++;

  }

  /* boss damage */

  if(
   Math.abs(player.x-boss.x)<100 &&
   boss.timer%50===0 &&
   !player.invincible
  ){

   player.hp-=15;

  }

  if(boss.hp<=0){

   player.score+=10000;

   message(
    "🏆 TWISTED WARDEN DEFEATED!",
    4000
   );

   boss=null;

   document.getElementById("boss")
     .style.display="none";

  }

 }

 /* particles */

 for(const p of particles){

  p.x+=p.vx;
  p.y+=p.vy;
  p.vy+=.25;
  p.life--;

 }

 particles=particles.filter(p=>p.life>0);

 /* UI */

 document.getElementById("speed")
   .textContent=Math.round(Math.abs(player.vx)*100);

 document.getElementById("rings")
   .textContent=player.rings;

 document.getElementById("hp")
   .textContent=Math.max(0,Math.round(player.hp));

 document.getElementById("score")
   .textContent=player.score;

 document.getElementById("form")
   .textContent=player.form;

 if(boss){

  document.getElementById("bossHP")
   .style.width=
   (boss.hp/boss.max*100)+"%";

 }

 if(player.hp<=0){

  message(
   "💥 GAME OVER — PRESS R TO RESTART",
   999999
  );

 }

 if(messageTimer<999999)
   messageTimer-=16;

 if(messageTimer<=0)
   document.getElementById("message").innerHTML="";

 camera+=(player.x-camera-300)*.08;
}

/* draw */

function draw(){

 ctx.clearRect(
  0,0,
  canvas.width,
  canvas.height
 );

 /* sky */

 let gradient=
   ctx.createLinearGradient(
    0,0,
    0,canvas.height
   );

 gradient.addColorStop(
  0,
  player.form==="HYPER"
   ? "#24145c"
   : "#071c38"
 );

 gradient.addColorStop(
  1,
  "#163b24"
 );

 ctx.fillStyle=gradient;
 ctx.fillRect(
  0,0,
  canvas.width,
  canvas.height
 );

 /* distant mountains */

 ctx.fillStyle="#163247";

 for(let i=-3;i<15;i++){

  let xx=
   i*220-
   (camera*.25%220);

  ctx.beginPath();

  ctx.moveTo(xx,GROUND);
  ctx.lineTo(xx+110,290);
  ctx.lineTo(xx+240,GROUND);

  ctx.fill();

 }

 /* Minecraft blocks */

 for(const b of blocks){

  let sx=b.x-camera;

  if(sx<-100||sx>canvas.width+100)
    continue;

  ctx.fillStyle="#536f3d";

  ctx.fillRect(
   sx,
   b.y,
   b.w,
   b.h
  );

  ctx.fillStyle="#789957";

  ctx.fillRect(
   sx,
   b.y,
   b.w,
   8
  );

  ctx.strokeStyle="#263a22";

  ctx.strokeRect(
   sx,
   b.y,
   b.w,
   b.h
  );

 }

 /* rings */

 for(const ring of rings){

  if(ring.taken)
    continue;

  let sx=ring.x-camera;

  if(sx>-30&&sx<canvas.width+30){

   ctx.strokeStyle="#ffd92e";
   ctx.lineWidth=5;

   ctx.beginPath();

   ctx.arc(
    sx,
    ring.y,
    13,
    0,
    Math.PI*2
   );

   ctx.stroke();

  }

 }

 /* mobs */

 for(const e of enemies){

  let sx=e.x-camera;
  let sy=e.y;

  ctx.fillStyle=
   e.type==="Frostmaw"
   ? "#83dfff"
   : "#55335f";

  ctx.beginPath();

  ctx.arc(
   sx,
   sy,
   e.type==="Frostmaw"?55:45,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(sx-15,sy-10,7,0,7);
  ctx.arc(sx+15,sy-10,7,0,7);

  ctx.fill();

 }

 /* warden */

 if(boss){

  let sx=boss.x-camera;
  let sy=boss.y;

  ctx.fillStyle="#342040";

  ctx.beginPath();

  ctx.arc(
   sx,
   sy,
   75,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle="#a95aff";
  ctx.lineWidth=7;

  ctx.stroke();

  ctx.fillStyle="#c66cff";

  ctx.fillRect(
   sx-38,
   sy+10,
   76,
   13
  );

 }

 /* Sonic */

 let px=player.x-camera;
 let py=player.y;

 ctx.save();

 ctx.translate(px,py);

 ctx.rotate(player.vx*.025);

 if(player.form==="SUPER")
   ctx.shadowBlur=35;

 if(player.form==="HYPER")
   ctx.shadowBlur=55;

 ctx.shadowColor=
   player.form==="HYPER"
   ? "#ffffff"
   : "#44ddff";

 ctx.fillStyle=
   player.form==="SUPER"
   ? "#ffd92e"
   : player.form==="HYPER"
   ? "#ffffff"
   : "#168cff";

 ctx.beginPath();

 ctx.arc(
  0,
  0,
  24,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.shadowBlur=0;

 /* eyes */

 ctx.fillStyle="white";

 ctx.beginPath();

 ctx.arc(9,-8,8,0,7);

 ctx.fill();

 ctx.fillStyle="#111";

 ctx.beginPath();

 ctx.arc(11,-8,3,0,7);

 ctx.fill();

 /* shoes */

 ctx.fillStyle="#e53935";

 ctx.fillRect(-22,16,19,8);
 ctx.fillRect(4,16,19,8);

 ctx.restore();

 /* particles */

 for(const p of particles){

  ctx.globalAlpha=
   p.life/45;

  ctx.fillStyle=p.color;

  ctx.fillRect(
   p.x-camera,
   p.y,
   6,
   6
  );

 }

 ctx.globalAlpha=1;

 /* darkness */

 if(darkness>0){

  ctx.fillStyle=
   "rgba(5,0,20,"+
   Math.min(.35,darkness/100)+")";

  ctx.fillRect(
   0,0,
   canvas.width,
   canvas.height
  );

 }

}

function loop(){

 update();
 draw();

 requestAnimationFrame(loop);

}

message(
 "🌎 ULTIMATE MOD CHAOS — GO!",
 3000
);

loop();
</script>
</body>
</html>
