<script>
"use strict";
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=Math.max(1,Math.min(2,devicePixelRatio||1));
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();

const rosterEl=document.getElementById("roster"), statsEl=document.getElementById("statsText");
const missionEl=document.getElementById("mission"), center=document.getElementById("center");

const keys={};
addEventListener("keydown",e=>{

  if([" ","arrowleft","arrowright","shift"].includes(k))e.preventDefault();
  if(k==="q")changeHero(1);
  if(k==="r")restart();
  if(k==="e"){special();keys[k]=false}
  if(k==="1")selectHero(0);if(k==="2")selectHero(1);if(k==="3")selectHero(2);if(k==="4")selectHero(3);if(k==="5")selectHero(4);
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll(".btn").forEach(b=>{
  const k=b.dataset.k;
  const set=(v)=>(ev)=>{ev.preventDefault(); if(k==="switch"&&v)changeHero(1); else keys[k]=v};
  b.addEventListener("pointerdown",set(true)); b.addEventListener("pointerup",set(false));
  b.addEventListener("pointercancel",set(false)); b.addEventListener("pointerleave",set(false));
});

const HEROES=[
{name:"Sonic",short:"SONIC",base:"#1976ff",speed:1.00,jump:1.10,ability:"Homing Attack",power:"Chaos Burst",specialText:"Spin Dash + Homing Attack"},
{name:"Tails",short:"TAILS",base:"#f3a51f",speed:.78,jump:1.22,ability:"Flight",power:"Twin Shot",specialText:"Short air flight"},

];
let hero=0;
function selectHero(i){if(i>=0&&i<HEROES.length){hero=i;updateRoster();}}
function changeHero(d){hero=(hero+d+HEROES.length)%HEROES.length;updateRoster();burst(player.x,player.y,18,1.2)}
function updateRoster(){rosterEl.innerHTML=HEROES.map((h,i)=>`<div class="card ${i===hero?"active":""}">${i+1} ${h.short}</div>`).join("")}

const world={w:24000,waterH:.70};
let player,coins,enemies,platforms,boostPads,particles,cam,score,rings,combo,comboTime,time,checkpoint,win,mission,zone,boss;
function ground(){return H*world.waterH}
function resetWorld(){
  player={x:280,y:ground()-60,vx:0,vy:0,r:27,onGround:false,jumps:0,boost:100,health:100,inv:0,fly:0};
  coins=[];enemies=[];platforms=[];boostPads=[];particles=[];cam=0;score=0;rings=0;combo=0;comboTime=0;time=0;checkpoint=280;win=false;zone=0;boss=null;
  for(let i=0;i<150;i++){
    const x=520+i*145+Math.random()*95;
    const y=ground()-90-Math.random()*220;
    coins.push({x,y,got:false,r:10,spin:Math.random()*6});
  }
  for(let i=0;i<80;i++){
    const x=750+i*260+Math.random()*160;
    enemies.push({x,y:ground()-34,r:25,type:i%4,alive:true,phase:Math.random()*10,hp:1});
  }
  for(let i=0;i<26;i++){
    const x=850+i*800+Math.random()*200;
    const y=ground()-210-Math.random()*120;
    platforms.push({x,y,w:180+Math.random()*160,h:18});
  }
  for(let i=0;i<22;i++) boostPads.push({x:600+i*950,y:ground()-18});
  boss={x:world.w-1100,y:ground()-70,r:58,hp:45,max:45,alive:true,phase:0};
  enemies.push(boss);
  mission={type:"rings",need:35,done:false};
  updateRoster(); hideCenter();
}
function hideCenter(){center.style.display="none"}
function showCenter(a,b){centerTitle.textContent=a;centerText.textContent=b;center.style.display="block"}

function burst(x,y,n,scale=1,kind="spark"){
  for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*11*scale,vy:(Math.random()-.5)*11*scale,life:.5+Math.random()*.9,r:2+Math.random()*6,kind});
}
function fireProjectile(kind){
  const dir=Math.sign(player.vx||1);
  particles.push({x:player.x+dir*28,y:player.y-7,vx:14*dir,vy:0,life:1.25,r:8,kind});
}
let lastSpecial=-10;
function special(){
  if(win||time-lastSpecial<.55)return;
  lastSpecial=time;
  const h=HEROES[hero];
  if(h.name==="Sonic"){player.vx+=Math.sign(player.vx||1)*12;player.inv=.35;burst(player.x,player.y,28,1.7,"blue")}
  else if(h.name==="Tails"){player.fly=1.7;burst(player.x,player.y,20,1.3,"gold")}
  else if(h.name==="Knuckles"){burst(player.x,ground()-20,35,2.0,"red"); enemies.forEach(e=>{if(e.alive&&Math.abs(e.x-player.x)<230)e.hp=0})}
  else if(h.name==="Amy"){player.vx+=Math.sign(player.vx||1)*8;burst(player.x+35,player.y,30,1.4,"pink")}
  else if(h.name==="Shadow"){player.vx+=Math.sign(player.vx||1)*18;player.inv=.8;burst(player.x,player.y,35,2.0,"purple")}
  else if(h.name==="Goku"){for(let i=0;i<7;i++)fireProjectile("ki")}
  else if(h.name==="Naruto"){for(let i=0;i<4;i++)fireProjectile("orange")}
  else if(h.name==="Ben 10"){player.inv=1.25;player.vx+=Math.sign(player.vx||1)*12;burst(player.x,player.y,25,1.5,"green")}
  else if(h.name==="SpongeBob"){for(let i=0;i<9;i++)particles.push({x:player.x+30,y:player.y+(i-4)*6,vx:10+Math.random()*4,vy:(i-4)*.4,life:1.1,r:7,kind:"bubble"})}
  else if(h.name==="Bugs Bunny"){particles.push({x:player.x+30,y:player.y-5,vx:11,vy:-1,life:1.8,r:11,kind:"carrot"})}
  else if(h.name==="Mickey"){for(let i=0;i<12;i++)particles.push({x:player.x+30,y:player.y-5,vx:7+i*.25,vy:(Math.random()-.5)*8,life:.9,r:5,kind:"magic"})}
  else if(h.name==="Samurai Jack"){for(let i=0;i<5;i++)particles.push({x:player.x+45,y:player.y-5+i*4,vx:13,vy:(i-2)*1.2,life:.95,r:7,kind:"sword"})}
}

function collidesWithPlatform(){
  for(const p of platforms){
    if(player.x+player.r>p.x&&player.x-player.r<p.x+p.w &&
       player.y+player.r>=p.y&&player.y+player.r<=p.y+p.h+18&&player.vy>=0){
      player.y=p.y-player.r;player.vy=0;player.onGround=true;player.jumps=0;return true;
    }
  }
  return false;
}
function update(dt){
  if(win)return;
  time+=dt;
  const h=HEROES[hero];
  const left=keys.a||keys.arrowleft||keys.left, right=keys.d||keys.arrowright||keys.right;
  const jump=keys[" "]||keys.w||keys.arrowup||keys.jump;
  const boosting=keys.shift||keys.boost;
  if(left)player.vx-=1.0*h.speed;
  if(right)player.vx+=1.15*h.speed;
  const max=boosting?34*h.speed:22*h.speed;
  player.vx*=Math.pow(.90,dt*60);
  player.vx=Math.max(-18*h.speed,Math.min(max,player.vx));
  if(boosting&&Math.abs(player.vx)>3&&player.boost>0)player.boost=Math.max(0,player.boost-34*dt);
  else player.boost=Math.min(100,player.boost+16*dt);
  if(jump&&!keys._jumpLock){
    if(player.onGround||player.jumps<1){player.vy=-16*h.jump;player.onGround=false;player.jumps++;burst(player.x,player.y+20,7,.8)}
    keys._jumpLock=true;
  }
  if(!jump)keys._jumpLock=false;
  if(keys._specialLock){}
  player.vy+=.78*dt*60;
  if(player.fly>0){player.fly-=dt;player.vy*=.88;if(jump)player.vy=-3}
  player.y+=player.vy*dt*4;
  player.x+=player.vx*dt*4;
  player.onGround=false;
  collidesWithPlatform();
  if(player.y>=ground()-player.r){player.y=ground()-player.r;player.vy=0;player.onGround=true;player.jumps=0}
  player.x=Math.max(20,Math.min(world.w-60,player.x));
  player.inv=Math.max(0,player.inv-dt);
  boostPads.forEach(pad=>{if(Math.abs(player.x-pad.x)<36&&Math.abs(player.y-pad.y)<30){player.vx=Math.max(player.vx,28);burst(pad.x,pad.y,5,1,"boost")}});
  coins.forEach(r=>{r.spin+=dt*7;if(!r.got&&Math.hypot(player.x-r.x,player.y-r.y)<player.r+r.r+7){r.got=true;rings++;score+=15;burst(r.x,r.y,5,.6,"ring")}});
  enemies.forEach(e=>{
    if(!e.alive)return;
    e.phase+=dt*(1.5+e.type*.3);
    if(!e.boss)e.x+=Math.sin(e.phase)*.5;
    if(e.boss){e.x+=Math.sin(e.phase)*.55; if(Math.abs(player.x-e.x)<620&&Math.random()<dt*.8)particles.push({x:e.x-80,y:e.y-20,vx:-12,vy:(Math.random()-.5)*2,life:1.2,r:9,kind:"bossbolt"})}
    // hero projectiles use particles; enemy collision handled below
    const d=Math.hypot(player.x-e.x,player.y-e.y);
    if(d<player.r+e.r){
      if(e.boss){
        if(Math.abs(player.vx)>10||hero===4||hero===5){e.hp-=1;score+=120;player.vy=-12;player.inv=.25;burst(e.x,e.y,25,1.3,e.boss?"boss":"spark")}
        else if(player.inv<=0){player.health-=18;player.inv=1.0;player.vx=-player.vx*.7;burst(player.x,player.y,20,.9,"hit")}
        if(e.hp<=0){e.alive=false;score+=10000;burst(e.x,e.y,90,3,"bossdeath")}
      }else{
        if(Math.abs(player.vx)>8||hero!==0){e.alive=false;score+=250;combo++;comboTime=2.5;burst(e.x,e.y,24,1.2,"enemy");player.vy=-10}
        else if(player.inv<=0){player.health-=10;player.inv=1.0;player.vx=-player.vx*.65}
      }
    }
  });
  particles.forEach(q=>{
    q.x+=q.vx*dt*4;q.y+=q.vy*dt*4;q.life-=dt;
    if(q.kind==="bossbolt"&&q.life>0&&player.inv<=0&&Math.hypot(player.x-q.x,player.y-q.y)<player.r+q.r){
      player.health-=14;player.inv=.9;q.life=0;burst(player.x,player.y,15,.7,"hit")
    }
    if(["ki","orange","bubble","carrot","magic","sword","shot"].includes(q.kind)){
      enemies.forEach(e=>{
        if(e.alive&&!e.boss&&Math.hypot(e.x-q.x,e.y-q.y)<e.r+q.r){e.alive=false;q.life=0;score+=220;combo++;comboTime=2.5;burst(e.x,e.y,14,1,"enemy")}
      });
      if(boss.alive&&Math.hypot(boss.x-q.x,boss.y-q.y)<boss.r+q.r){boss.hp-=2;q.life=0;score+=280;burst(boss.x,boss.y,10,1.1,"boss")}
    }
  });
  particles=particles.filter(q=>q.life>0&&q.x>-100&&q.x<world.w+100);
  if(comboTime>0)comboTime-=dt;else combo=0;
  if(rings>=mission.need)mission.done=true;
  if(mission.done&&player.x>world.w-1600)missionEl.textContent="FINAL OBJECTIVE: defeat the Titan Core and reach the Chaos Gate →";
  else missionEl.textContent=`MISSION: collect ${mission.need} Rings (${Math.min(rings,mission.need)}/${mission.need})`;
  if(boss.alive && player.x>boss.x-1000){bossbar.style.display="block";bossfill.style.width=(100*boss.hp/boss.max)+"%"}else bossbar.style.display="none";
  if(player.health<=0){showCenter("MISSION FAILED","Press R to restart the island.");return}
  if(!boss.alive&&player.x>world.w-180){win=true;showCenter("CHAOS WORLD CLEARED!","Score "+score.toLocaleString()+" • Rings "+rings+" • Combo "+combo+" • Press R to play again");}
  cam=Math.max(0,Math.min(world.w-W/1.15,player.x-W*.33));
}
function drawBackground(){
  const gy=ground();
  let sky=ctx.createLinearGradient(0,0,0,gy);sky.addColorStop(0,"#62c8ff");sky.addColorStop(1,"#effcff");ctx.fillStyle=sky;ctx.fillRect(0,0,W,gy);
  // sun
  ctx.fillStyle="rgba(255,250,205,.75)";ctx.beginPath();ctx.arc(W*.78,H*.16,70,0,Math.PI*2);ctx.fill();
  // layered islands
  for(let l=0;l<3;l++){
    const off=cam*(.10+.09*l), base=gy-(l*28+4);
    ctx.fillStyle=["#7fae91","#5d8f70","#3f684f"][l];
    ctx.beginPath();ctx.moveTo(0,base);
    for(let x=-300;x<W+300;x+=250){
      const px=x-off%250;
      ctx.lineTo(px+70,base-95-l*18-Math.sin((x+off)/170)*18);
      ctx.lineTo(px+170,base-8);
    }
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  }
  // water
  ctx.fillStyle="#1e7d9e";ctx.fillRect(0,gy+12,W,H-gy-12);
  for(let x=-100-(cam%150);x<W+200;x+=150){
    ctx.strokeStyle="rgba(255,255,255,.22)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,gy+55);ctx.quadraticCurveTo(x+38,gy+43,x+75,gy+55);ctx.stroke();
  }
}
function sx(x){return x-cam}
function drawWorld(){
  const gy=ground();
  // grass island
  ctx.fillStyle="#203f2c";ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle="#5b954f";ctx.fillRect(0,gy,W,12);
  for(let x=Math.floor(cam/100)*100;x<cam+W+200;x+=100){ctx.fillStyle="#376c40";ctx.fillRect(sx(x),gy+15,46,9)}
  // ancient towers
  for(let x=Math.floor(cam/650)*650;x<cam+W+800;x+=650){
    const xx=sx(x);ctx.fillStyle="#71838b";ctx.fillRect(xx,gy-265,58,265);ctx.fillStyle="#9daeb2";ctx.fillRect(xx-10,gy-277,78,16);ctx.fillStyle="#53636a";ctx.fillRect(xx+12,gy-215,34,72);
  }
  // rails
  for(let x=Math.floor(cam/800)*800;x<cam+W+900;x+=800){
    const xx=sx(x);ctx.strokeStyle="rgba(230,245,247,.42)";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(xx,gy-250);ctx.quadraticCurveTo(xx+180,gy-360,xx+430,gy-210);ctx.stroke();
  }
  // platforms
  platforms.forEach(p=>{if(sx(p.x)>W+100||sx(p.x+p.w)<-100)return;ctx.fillStyle="#8e9ca0";ctx.fillRect(sx(p.x),p.y,p.w,p.h);ctx.fillStyle="#c2ced0";ctx.fillRect(sx(p.x),p.y,p.w,5)});
  // boost pads
  boostPads.forEach(p=>{const xx=sx(p.x);if(xx<-50||xx>W+50)return;ctx.fillStyle="#ffe063";ctx.fillRect(xx-32,p.y,64,9);ctx.fillStyle="#1b5";for(let i=0;i<4;i++)ctx.fillRect(xx-22+i*14,p.y-5,9,5)});
  // rings
  coins.forEach(r=>{if(r.got)return;const xx=sx(r.x);if(xx<-20||xx>W+20)return;ctx.strokeStyle="#ffd94c";ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(xx,r.y,r.r*(.5+.5*Math.abs(Math.cos(r.spin))),r.r,0,0,Math.PI*2);ctx.stroke()});
  // enemies
  enemies.forEach(e=>{if(!e.alive)return;const xx=sx(e.x);if(xx<-100||xx>W+100)return;
    ctx.save();ctx.translate(xx,e.y);
    if(e.boss)drawBoss();else drawEnemy(e);
    ctx.restore();
  });
}
function drawEnemy(e){
  ctx.fillStyle=e.type===0?"#b12b30":e.type===1?"#314b9b":e.type===2?"#7a3e86":"#4a4e55";
  ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f5f7fa";ctx.beginPath();ctx.arc(-9,-7,5,0,7);ctx.arc(9,-7,5,0,7);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(-8,-7,2.3,0,7);ctx.arc(8,-7,2.3,0,7);ctx.fill();
  ctx.fillStyle="#222";ctx.fillRect(-18,13,36,8);
}
function drawBoss(){
  const r=boss.r;
  ctx.fillStyle="#49234f";ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#242a35";ctx.fillRect(-42,-25,84,48);
  ctx.fillStyle="#db39dd";ctx.beginPath();ctx.arc(0,-10,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f5f5f5";ctx.fillRect(-29,15,58,8);
  ctx.fillStyle="#ff6b6b";ctx.fillRect(-30,-54,60,8);ctx.fillStyle="#77ef92";ctx.fillRect(-30,-54,60*(boss.hp/boss.max),8);
}
function drawPlayer(){
  const h=HEROES[hero],x=sx(player.x),y=player.y;
  ctx.save();ctx.translate(x,y);
  if(player.vx<-.2)ctx.scale(-1,1);
  // aura during boost/special
  if(Math.abs(player.vx)>16){
    ctx.strokeStyle=h.base;ctx.globalAlpha=.32;ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,0,38,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  }
  if(h.name==="Sonic"||h.name==="Shadow"){
