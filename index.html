<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ultimate Mod Chaos 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07111e}
canvas{display:block}
#ui{
 position:fixed;left:15px;top:15px;z-index:10;
 color:white;font:700 18px Arial;
 text-shadow:2px 2px 3px #000;line-height:1.55
}
#help{
 position:fixed;right:15px;bottom:15px;z-index:10;
 color:white;font:15px Arial;text-align:right;
 text-shadow:2px 2px 3px #000
}
#boss{
 display:none;position:fixed;left:25%;top:18px;
 width:50%;height:20px;border:2px solid white;
 background:#222;z-index:10
}
#bossFill{height:100%;width:100%;background:#9b42ff}
#message{
 position:fixed;left:0;right:0;top:45%;z-index:20;
 text-align:center;color:white;font:bold 34px Arial;
 text-shadow:3px 3px 5px #000;pointer-events:none
}
</style>
</head>
<body>

<div id="ui">
⚡ Speed: <span id="speed">0</span><br>
💍 Rings: <span id="rings">0</span><br>
❤️ HP: <span id="hp">100</span><br>
🏆 Score: <span id="score">0</span><br>
🌟 Form: <span id="form">Normal</span><br>
🟡 Verity: Friendly
</div>

<div id="boss"><div id="bossFill"></div></div>
<div id="message"></div>

<div id="help">
A/D or ←/→ Move<br>
W / Space Jump<br>
Shift Boost<br>
E Attack<br>
1 Super Sonic<br>
2 Hyper Sonic<br>
R Restart
</div>

<script type="module">

import * as THREE
from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x72c9ff);
scene.fog=new THREE.Fog(0x72c9ff,80,500);

const camera=new THREE.PerspectiveCamera(
 70,
 innerWidth/innerHeight,
 .1,
 2000
);

const renderer=new THREE.WebGLRenderer({
 antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

/* LIGHTING */

const sun=new THREE.DirectionalLight(
 0xffffff,
 3
);

sun.position.set(
 100,
 180,
 100
);

sun.castShadow=true;

scene.add(sun);

scene.add(
 new THREE.HemisphereLight(
  0x9edcff,
  0x385020,
  1.5
 )
);

/* WORLD */

const groundMat=new THREE.MeshStandardMaterial({
 color:0x4f873d,
 roughness:.9
});

const ground=new THREE.Mesh(
 new THREE.BoxGeometry(
  2000,
  10,
  80
 ),
 groundMat
);

ground.position.set(
 800,
 -5,
 0
);

ground.receiveShadow=true;

scene.add(ground);

/* BLOCK TERRAIN */

for(let i=0;i<150;i++){

 const height=
  2+
  Math.floor(Math.random()*8);

 const mat=
  new THREE.MeshStandardMaterial({
   color:
    i%3===0
    ?0x679b45
    :0x4d783a
  });

 const block=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    5+Math.random()*4,
    height,
    12
   ),
   mat
  );

 block.position.set(
  15+i*12,
  height/2-0.1,
  0
 );

 block.castShadow=true;
 block.receiveShadow=true;

 scene.add(block);
}

/* PLAYER */

const player=new THREE.Group();

scene.add(player);

const bodyMat=
 new THREE.MeshStandardMaterial({
  color:0x168cff,
  roughness:.45
 });

const body=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   1.25,
   32,
   20
  ),
  bodyMat
 );

body.scale.set(
 .95,
 1.05,
 .85
 );

body.castShadow=true;

player.add(body);

/* nose */

const nose=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   .28,
   16,
   16
  ),
  new THREE.MeshStandardMaterial({
   color:0x197cff
  })
 );

nose.position.set(
 0,
 .15,
 -1.15
);

player.add(nose);

/* eyes */

const eyeMat=
 new THREE.MeshStandardMaterial({
  color:0xffffff
 });

const blackMat=
 new THREE.MeshStandardMaterial({
  color:0x111111
 });

for(const x of [-.32,.32]){

 const eye=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .28,
    16,
    16
   ),
   eyeMat
  );

 eye.position.set(
  x,
  .48,
  -.95
 );

 player.add(eye);

 const pupil=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .1,
    12,
    12
   ),
   blackMat
  );

 pupil.position.set(
  x,
  .48,
  -1.18
 );

 player.add(pupil);
}

/* shoes */

const shoeMat=
 new THREE.MeshStandardMaterial({
  color:0xe63232
 });

for(const x of [-.62,.62]){

 const shoe=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .75,
    .35,
    1.25
   ),
   shoeMat
  );

 shoe.position.set(
   x,
  -1.15,
  -.25
 );

 shoe.castShadow=true;

 player.add(shoe);
}

player.position.set(
 0,
 2,
 0
);

/* GAME STATE */

let velocity=0;
let verticalVelocity=0;
let grounded=true;

let rings=0;
let hp=100;
let score=0;

let form="Normal";

let superMode=false;
let hyperMode=false;

const keys={};

addEventListener(
 "keydown",
 e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.key==="1")
   activateSuper();

  if(e.key==="2")
   activateHyper();

  if(e.key.toLowerCase()==="r")
   location.reload();
 }
);

addEventListener(
 "keyup",
 e=>{
  keys[e.key.toLowerCase()]=false;
 }
);

/* RINGS */

const ringMat=
 new THREE.MeshStandardMaterial({
  color:0xffd92e,
  emissive:0x5a4300
 });

const ringObjects=[];

for(let i=0;i<130;i++){

 const ring=
  new THREE.Mesh(
   new THREE.TorusGeometry(
    .45,
    .09,
    10,
    24
   ),
   ringMat
  );

 ring.position.set(
   15+i*13,
   3+Math.sin(i)*1.5,
   0
 );

 ring.rotation.y=Math.PI/2;

 scene.add(ring);

 ringObjects.push(ring);
}

/* FRIENDLY VERITY */

const verity=new THREE.Group();

scene.add(verity);

verity.position.set(
 20,
 1.7,
 -5
);

/* original friendly yellow companion */

const verityBody=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   .9,
   24,
   16
  ),
  new THREE.MeshStandardMaterial({
   color:0xffd21c
  })
 );

verityBody.castShadow=true;
verity.add(verityBody);

const smile=
 new THREE.Mesh(
  new THREE.TorusGeometry(
   .25,
   .045,
   8,
   20,
   Math.PI
  ),
  new THREE.MeshStandardMaterial({
   color:0x333333
  })
 );

smile.rotation.x=Math.PI/2;
smile.position.z=-.84;
smile.position.y=-.15;

verity.add(smile);

/*
 IMPORTANT:
 Verity is always friendly.
 No monster version.
 No creepy version.
 No demon.
 No horror event.
*/

function activateSuper(){

 if(rings>=50){

  form="Super";
  superMode=true;
  hyperMode=false;

  document.getElementById("message")
   .textContent="🌟 SUPER SONIC!";

  setTimeout(
   ()=>document.getElementById("message").textContent="",
   1500
  );

 }

}

function activateHyper(){

 if(rings>=100){

  form="Hyper";
  hyperMode=true;
  superMode=false;

  document.getElementById("message")
   .textContent="⚡🌟 HYPER SONIC!";

  setTimeout(
   ()=>document.getElementById("message").textContent="",
   1500
  );

 }

}

/* MOWZIE-STYLE BOSSES */

const mobs=[];

function createMob(
 name,
 color,
 x,
 size
){

 const group=new THREE.Group();

 const mesh=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    size,
    24,
    16
   ),
   new THREE.MeshStandardMaterial({
    color
   })
  );

 mesh.castShadow=true;

 group.add(mesh);

 group.position.set(
  x,
  size,
  0
 );

 scene.add(group);

 mobs.push({
  group,
  name,
  hp:300,
  maxHP:300
 });

}

createMob(
 "Frostmaw",
 0x72ddff,
 900,
 3
);

createMob(
 "Wroughtnaut",
 0x59606c,
 1800,
 3.5
);

createMob(
 "Umvuthi",
 0xc98a28,
 3000,
 3
);

createMob(
 "Barako",
 0xffc12a,
 4300,
 3
);

/* TWISTED WARDEN */

let warden=null;

function createWarden(){

 const group=new THREE.Group();

 const material=
  new THREE.MeshStandardMaterial({
   color:0x4c286e,
   roughness:.55
  });

 const body=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    6,
    9,
    5
   ),
   material
  );

 body.castShadow=true;

 group.add(body);

 group.position.set(
  player.position.x+45,
  4.5,
  0
 );

 scene.add(group);

 warden={
  group,
  hp:1000,
  maxHP:1000
 };

 document.getElementById("boss")
  .style.display="block";

}

/* COMBAT */

function attack(){

 if(keys["e"]){

  for(const mob of mobs){

   const d=
    player.position.distanceTo(
     mob.group.position
    );

   if(d<8){

    const damage=
     hyperMode?20:
     superMode?12:
     6;

    mob.hp-=damage;
    score++;

   }

  }

  if(warden){

   const d=
    player.position.distanceTo(
     warden.group.position
    );

   if(d<9){

    warden.hp-=
     hyperMode?20:
     superMode?12:
     6;

   }

  }

 }

}

/* GAME LOOP */

const clock=new THREE.Clock();

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(
  clock.getDelta(),
  .033
 );

 /* movement */

 const left=
  keys["a"]||
  keys["arrowleft"];

 const right=
  keys["d"]||
  keys["arrowright"];

 const boost=keys["shift"];

 let maxSpeed=
  hyperMode?1.8:
  superMode?1.25:
  boost?1.0:.55;

 if(left)
  velocity-=.035;

 if(right)
  velocity+=.035;

 if(!left&&!right)
  velocity*=.92;

 velocity=
  THREE.MathUtils.clamp(
   velocity,
   -maxSpeed,
   maxSpeed
  );

 if(
  (keys["w"]||
   keys[" "])&&
  grounded
 ){

  verticalVelocity=.32;
  grounded=false;

 }

 verticalVelocity-=.018;

 player.position.y+=
  verticalVelocity;

 if(player.position.y<=1.25){

  player.position.y=1.25;
  verticalVelocity=0;
  grounded=true;

 }

 player.position.x+=
  velocity*60*dt;

 player.position.x=
  Math.max(
   0,
   Math.min(
    1900,
    player.position.x
   )
  );

 /* rings */

 for(const ring of ringObjects){

  if(!ring.visible)
   continue;

  ring.rotation.x+=.08;

  const d=
   player.position.distanceTo(
    ring.position
   );

  if(d<2){

   ring.visible=false;
   rings++;
   score+=10;

  }

 }

 /* Mowzie bosses */

 for(const mob of mobs){

  if(mob.hp<=0){

   mob.group.visible=false;
   continue;

  }

  if(mob.group.visible){

   mob.group.rotation.y+=
    dt*.5;

   const distance=
    player.position.x-
    mob.group.position.x;

   if(Math.abs(distance)<30){

    mob.group.position.x+=
     Math.sign(distance)*.025;

   }

  }

 }

 /* WARDEN */

 if(!warden && score>=1500)
  createWarden();

 if(warden){

  warden.group.rotation.y+=dt;

  const distance=
   player.position.x-
   warden.group.position.x;

  warden.group.position.x+=
   Math.sign(distance)*.035;

  if(
   Math.abs(distance)<8 &&
   !superMode &&
   !hyperMode
  ){

   hp-=.2;

  }

  if(warden.hp<=0){

   score+=10000;

   scene.remove(
    warden.group
   );

   warden=null;

   document.getElementById("boss")
    .style.display="none";

   document.getElementById("message")
    .textContent=
    "🏆 TWISTED WARDEN DEFEATED!";

  }

 }

 attack();

 /* Verity follows peacefully */

 verity.position.x=
  player.position.x+5;

 verity.position.y=
  1.7+
  Math.sin(
   performance.now()*.002
  )*.2;

 /* camera */

 camera.position.x=
  player.position.x-12;

 camera.position.y=
  7;

 camera.position.z=
  15;

 camera.lookAt(
  player.position.x+8,
  2,
  0
 );

 /* UI */

 document.getElementById("speed")
  .textContent=
   Math.round(
    Math.abs(velocity)*100
   );

 document.getElementById("rings")
  .textContent=rings;

 document.getElementById("hp")
  .textContent=Math.max(
   0,
   Math.round(hp)
  );

 document.getElementById("score")
  .textContent=score;

 document.getElementById("form")
  .textContent=form;

 if(warden){

  document.getElementById("bossFill")
   .style.width=
   Math.max(
    0,
    warden.hp/
    warden.maxHP*100
   )+"%";

 }

 renderer.render(
  scene,
  camera
 );

}

addEventListener(
 "resize",
 ()=>{
  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

animate();

</script>
</body>
</html>
