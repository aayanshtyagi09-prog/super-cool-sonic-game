<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Roblox Mega World</title>
<style>
html,body{margin:0;overflow:hidden;background:#111;font-family:Arial}
canvas{display:block}
#ui{
 position:fixed;top:15px;left:15px;color:white;
 background:rgba(0,0,0,.65);padding:14px;border-radius:10px;
 font-size:18px;line-height:1.5
}
#msg{
 position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
 color:white;background:rgba(0,0,0,.7);padding:12px 22px;
 border-radius:10px;font-size:20px
}
</style>
</head>
<body>
<div id="ui">
💰 Coins: <span id="coins">0</span><br>
🍔 Burgers: <span id="burgers">0</span>/10<br>
💨 Speed: <span id="speed">1</span>x<br>
🎮 World: <span id="world">MEGA HUB</span>
</div>
<div id="msg">WASD = Move | SHIFT = Boost | SPACE = Jump</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x78b9ff);

const camera=new THREE.PerspectiveCamera(
 75,innerWidth/innerHeight,.1,2000
);
camera.position.set(0,8,14);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(30,60,20);
sun.castShadow=true;
scene.add(sun);

const player=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.BoxGeometry(2,2.4,1),
 new THREE.MeshStandardMaterial({color:0x1877f2})
);
body.position.y=2.2;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
 new THREE.BoxGeometry(2,2,2),
 new THREE.MeshStandardMaterial({color:0xffc58a})
);
head.position.y=4.4;
head.castShadow=true;
player.add(head);

function limb(x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(.65,2,.65),
  new THREE.MeshStandardMaterial({color:0xffc58a})
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 player.add(m);
}
limb(-1.3,1.4,0);
limb(1.3,1.4,0);

const leg1=new THREE.Mesh(
 new THREE.BoxGeometry(.75,2,.75),
 new THREE.MeshStandardMaterial({color:0x222222})
);
leg1.position.set(-.55,.4,0);
player.add(leg1);

const leg2=leg1.clone();
leg2.position.x=.55;
player.add(leg2);

player.position.set(0,0,0);
scene.add(player);

const ground=new THREE.Mesh(
 new THREE.BoxGeometry(500,1,500),
 new THREE.MeshStandardMaterial({color:0x55aa55})
);
ground.position.y=-.5;
ground.receiveShadow=true;
scene.add(ground);

const keys={};
addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="Space" && player.position.y<=.05)
   velocityY=.32;
});
addEventListener("keyup",e=>keys[e.code]=false);

let velocityY=0;
let coins=0;
let burgerCount=0;
let world="MEGA HUB";
let speedBoost=1;

const burgers=[];

function makeBurger(x,y,z){
 const g=new THREE.Group();

 const bun=new THREE.Mesh(
  new THREE.SphereGeometry(.8,.16,8),
  new THREE.MeshStandardMaterial({color:0xd88922})
 );
 bun.scale.y=.45;

 const meat=new THREE.Mesh(
  new THREE.BoxGeometry(1.2,.25,.8),
  new THREE.MeshStandardMaterial({color:0x54200e})
 );
 meat.position.y=-.15;

 const cheese=new THREE.Mesh(
  new THREE.BoxGeometry(1.3,.12,.9),
  new THREE.MeshStandardMaterial({color:0xffd51f})
 );
 cheese.position.y=.02;

 g.add(bun,meat,cheese);
 g.position.set(x,y,z);
 scene.add(g);
 burgers.push(g);
}

for(let i=0;i<10;i++){
 makeBurger(
  (Math.random()-.5)*100,
  1,
  (Math.random()-.5)*100
 );
}

const portals=[];

function portal(x,z,color,name){
 const p=new THREE.Mesh(
  new THREE.TorusGeometry(5,.7,16,40),
  new THREE.MeshStandardMaterial({
   color,
   emissive:color,
   emissiveIntensity:1
  })
 );
 p.position.set(x,5,z);
 p.rotation.x=Math.PI/2;
 scene.add(p);
 portals.push({mesh:p,name});
}

portal(-15,-15,0xff8b00,"FIND THE BURGERS");
portal(15,-15,0x00aaff,"SONIC SPEED");
portal(0,25,0xff00ff,"MEGA OBBY");

function distance(a,b){
 return a.position.distanceTo(b.position);
}

let last=performance.now();

function animate(now){
 requestAnimationFrame(animate);

 const dt=Math.min((now-last)/16,2);
 last=now;

 let dx=0,dz=0;

 if(keys.KeyW)dz-=1;
 if(keys.KeyS)dz+=1;
 if(keys.KeyA)dx-=1;
 if(keys.KeyD)dx+=1;

 const moving=dx||dz;

 if(moving){
  const len=Math.hypot(dx,dz);
  dx/=len;dz/=len;

  let speed=.22;

  if(keys.ShiftLeft||keys.ShiftRight){
   speed=.8;
   speedBoost=4;
  }else speedBoost=1;

  player.position.x+=dx*speed*dt;
  player.position.z+=dz*speed*dt;

  player.rotation.y=Math.atan2(dx,dz);
 }

 velocityY-=.018*dt;
 player.position.y+=velocityY*dt;

 if(player.position.y<0){
  player.position.y=0;
  velocityY=0;
 }

 // Camera follows player
 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+5,
  player.position.z+12
 );
 camera.position.lerp(target,.12);
 camera.lookAt(
  player.position.x,
  player.position.y+2.5,
  player.position.z
 );

 // Collect burgers
 for(let i=burgers.length-1;i>=0;i--){
  if(distance(player,burgers[i])<3){
   scene.remove(burgers[i]);
   burgers.splice(i,1);
   burgerCount++;
   coins+=25;
  }
 }

 // Portal detection
 for(const p of portals){
  if(player.position.distanceTo(p.mesh.position)<7){
   world=p.name;
  }
 }

 document.getElementById("coins").textContent=coins;
 document.getElementById("burgers").textContent=burgerCount;
 document.getElementById("speed").textContent=speedBoost;
 document.getElementById("world").textContent=world;

 renderer.render(scene,camera);
}

animate(performance.now());

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
